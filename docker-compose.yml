services:
  postgres:
    image: postgres:16
    container_name: wellness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wellness_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wellness"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wellness_postgres_data: